<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaveMyTokens marks</title>
    <meta name="description" content="Twenty candidate marks for SaveMyTokens, each drawn in SVG and again in characters." />
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --paper: #fbfbfd;
        --panel: #fff;
        --ink: #16161d;
        --muted: #6a6a7a;
        --rule: #e6e6ee;
        --accent: #2f5fd0;
        --mark-bg: #f2f2f7;
      }
      :root[data-theme="dark"] {
        --paper: #0d0d14;
        --panel: #15151d;
        --ink: #e9e9f0;
        --muted: #9a9aac;
        --rule: #23232d;
        --accent: #89b4fa;
        --mark-bg: #1c1c26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      }
      .wrap { max-width: 78rem; margin: 0 auto; padding: 3rem 1.5rem 6rem; }
      .head { display: flex; align-items: flex-start; gap: 1.5rem; margin-bottom: 3.5rem; }
      h1 { margin: 0 0 0.6rem; font-size: 2rem; letter-spacing: -0.03em; }
      .lede { margin: 0; max-width: 38rem; color: var(--muted); font-size: 0.98rem; }
      .toggle {
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.9rem;
        border: 1px solid var(--rule);
        border-radius: 0.55rem;
        background: var(--panel);
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .toggle:hover { color: var(--ink); border-color: var(--accent); }

      .grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
      .card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--rule);
        border-radius: 0.9rem;
        background: var(--panel);
        overflow: hidden;
      }
      .card:hover { border-color: var(--accent); }
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        padding: 2.4rem 1rem;
        background: var(--mark-bg);
      }
      .meta { padding: 1rem 1.2rem 1.2rem; }
      .row { display: flex; align-items: baseline; gap: 0.6rem; }
      .name { font-weight: 600; font-size: 0.92rem; }
      .num { margin-left: auto; color: var(--muted); font: 0.72rem ui-monospace, Menlo, monospace; }
      pre {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font: 11px/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
      }
      footer { margin-top: 4rem; color: var(--muted); font-size: 0.9rem; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div>
          <h1>Twenty marks</h1>
          <p class="lede">
            One idea each, three shapes at most. Shown large and again at favicon size, because a
            mark that only works big is not a mark. Each carries a character form for the terminal.
          </p>
        </div>
        <button class="toggle" id="toggle" type="button"><span id="toggle-icon">◐</span> <span id="toggle-text">Dark</span></button>
      </div>
      <div class="grid" id="grid"></div>
      <footer>
        <a href="index.html">Back to the site</a> · <a href="https://offbeatport.com">Offbeatport</a> ·
        <a href="https://github.com/offbeatport/savemytokens">GitHub</a> ·
        <a href="mailto:hello@offbeatport.com">hello@offbeatport.com</a>
      </footer>
    </div>

    <script>
      const A = "var(--accent)";
      const D = "var(--muted)";

      const MARKS = [
        { name: "Three bars", ascii: "███\n██\n█",
          d: `<rect x="4" y="8" width="40" height="7" rx="3.5" fill="${A}"/><rect x="4" y="20.5" width="26" height="7" rx="3.5" fill="${D}"/><rect x="4" y="33" width="14" height="7" rx="3.5" fill="${D}"/>` },

        { name: "Two bars", ascii: "████\n██",
          d: `<rect x="4" y="13" width="40" height="9" rx="4.5" fill="${A}"/><rect x="4" y="27" width="22" height="9" rx="4.5" fill="${D}"/>` },

        { name: "Split square", ascii: "▛▀▜\n▙▄▟",
          d: `<rect x="7" y="7" width="34" height="34" rx="8" fill="${D}"/><path d="M7 15a8 8 0 0 1 8-8h18a8 8 0 0 1 8 8v6H7z" fill="${A}"/>` },

        { name: "Half circle", ascii: "(●○)",
          d: `<circle cx="24" cy="24" r="17" fill="${D}"/><path d="M24 7a17 17 0 0 1 0 34z" fill="${A}"/>` },

        { name: "Bar in a ring", ascii: "(▬)",
          d: `<circle cx="24" cy="24" r="16" fill="none" stroke="${D}" stroke-width="4"/><rect x="14" y="21" width="14" height="6" rx="3" fill="${A}"/>` },

        { name: "Quarter", ascii: "◔",
          d: `<circle cx="24" cy="24" r="17" fill="${D}"/><path d="M24 7v17h17A17 17 0 0 0 24 7z" fill="${A}"/>` },

        { name: "Filled meter", ascii: "[███░░]",
          d: `<rect x="3" y="17" width="42" height="14" rx="7" fill="${D}"/><rect x="3" y="17" width="19" height="14" rx="7" fill="${A}"/>` },

        { name: "Divider", ascii: "███ ██",
          d: `<rect x="4" y="20" width="23" height="8" rx="4" fill="${A}"/><rect x="32" y="20" width="12" height="8" rx="4" fill="${D}"/>` },

        { name: "Chevron", ascii: "❯",
          d: `<path d="M15 12l14 12-14 12" fill="none" stroke="${A}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>` },

        { name: "Chevron and bar", ascii: "❯ ██",
          d: `<path d="M9 14l10 10-10 10" fill="none" stroke="${A}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="27" y="20" width="17" height="8" rx="4" fill="${D}"/>` },

        { name: "Column chart", ascii: "▁▄█",
          d: `<rect x="6" y="30" width="9" height="12" rx="3" fill="${D}"/><rect x="19.5" y="20" width="9" height="22" rx="3" fill="${D}"/><rect x="33" y="8" width="9" height="34" rx="3" fill="${A}"/>` },

        { name: "Stacked slab", ascii: "▀▀▀\n▄▄▄",
          d: `<rect x="6" y="10" width="36" height="12" rx="4" fill="${A}"/><rect x="6" y="26" width="36" height="12" rx="4" fill="${D}"/>` },

        { name: "Gauge", ascii: "◜◝\n ◞",
          d: `<path d="M9 33a15 15 0 1 1 30 0" fill="none" stroke="${D}" stroke-width="5" stroke-linecap="round"/><path d="M9 33a15 15 0 0 1 6.5-12.4" fill="none" stroke="${A}" stroke-width="5" stroke-linecap="round"/>` },

        { name: "Slash", ascii: "◍╱○",
          d: `<path d="M34 11L14 37" stroke="${D}" stroke-width="4.5" stroke-linecap="round"/><circle cx="14" cy="13" r="6" fill="${A}"/>` },

        { name: "Cut corner", ascii: "▛▀▚\n▙▄▟",
          d: `<path d="M7 15a8 8 0 0 1 8-8h13l13 13v13a8 8 0 0 1-8 8H15a8 8 0 0 1-8-8z" fill="${D}"/><path d="M28 7l13 13H28z" fill="${A}"/>` },

        { name: "Two panes", ascii: "▐█▌▕ ▏",
          d: `<rect x="6" y="10" width="16" height="28" rx="5" fill="${A}"/><rect x="26" y="10" width="16" height="28" rx="5" fill="${D}"/>` },

        { name: "Dot and bar", ascii: "● ███",
          d: `<circle cx="12" cy="24" r="7" fill="${A}"/><rect x="25" y="20" width="19" height="8" rx="4" fill="${D}"/>` },

        { name: "Wedge", ascii: "◤",
          d: `<path d="M8 40V12a4 4 0 0 1 6.2-3.3l26 18a4 4 0 0 1-2.2 7.3z" fill="${D}"/><path d="M8 40V12a4 4 0 0 1 6.2-3.3L26 17z" fill="${A}"/>` },

        { name: "Underline S", ascii: "S\n▔",
          d: `<text x="24" y="31" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="${D}">S</text><rect x="9" y="37" width="30" height="5" rx="2.5" fill="${A}"/>` },

        { name: "Nested squares", ascii: "▛▀▜\n▌▪▐",
          d: `<rect x="6" y="6" width="36" height="36" rx="9" fill="none" stroke="${D}" stroke-width="4"/><rect x="17" y="17" width="14" height="14" rx="4" fill="${A}"/>` },
      ];

      const svg = (mark, size) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${mark.d}</svg>`;

      document.getElementById("grid").innerHTML = MARKS.map(
        (mark, at) => `
        <div class="card">
          <div class="stage">${svg(mark, 72)}${svg(mark, 20)}</div>
          <div class="meta">
            <div class="row"><span class="name">${mark.name}</span><span class="num">${String(at + 1).padStart(2, "0")}</span></div>
            <pre>${mark.ascii}</pre>
          </div>
        </div>`,
      ).join("");

      const root = document.documentElement;
      const icon = document.getElementById("toggle-icon");
      const text = document.getElementById("toggle-text");
      const setTheme = (dark) => {
        root.dataset.theme = dark ? "dark" : "light";
        icon.textContent = dark ? "◑" : "◐";
        text.textContent = dark ? "Light" : "Dark";
        try {
          localStorage.setItem("smt-marks-theme", dark ? "dark" : "light");
        } catch {}
      };
      let stored = null;
      try {
        stored = localStorage.getItem("smt-marks-theme");
      } catch {}
      setTheme(stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
      document.getElementById("toggle").addEventListener("click", () => setTheme(root.dataset.theme !== "dark"));
    </script>
  </body>
</html>
