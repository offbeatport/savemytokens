  <text x="20" y="44.5" xml:space="preserve" textLength="780.0" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(147,153,178)">[savemytokens] 84% of your 20% target share of this Claude window is spent. Narrow the scope to the</tspan><tspan fill="#cdd6f4">   </tspan></text>
  <text x="20" y="63.25" xml:space="preserve" textLength="780.0" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(147,153,178)">smallest version that is genuinely done. Cut optional work, stop comparing alternatives, start</tspan><tspan fill="#cdd6f4">        </tspan></text>
  <text x="20" y="82" xml:space="preserve" textLength="780.0" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(147,153,178)">nothing new, and keep enough capacity for tests. Whatever you drop, write on its own line as `SMT:</tspan><tspan fill="#cdd6f4">    </tspan></text>
  <text x="20" y="100.75" xml:space="preserve" textLength="780.0" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(147,153,178)">DEFER &lt;one line&gt;`. It comes back at the start of the next session in this project, so dropping it</tspan><tspan fill="#cdd6f4">     </tspan></text>
  <text x="20" y="119.5" xml:space="preserve" textLength="780.0" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(147,153,178)">now costs nothing.</tspan><tspan fill="#cdd6f4">                                                                                    </tspan></text>
