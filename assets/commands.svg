<svg xmlns="http://www.w3.org/2000/svg" width="723" height="299" viewBox="0 0 723 299" role="img" aria-label="savemytokens">
  <rect width="723" height="299" rx="10" fill="#181825"/>
  <rect width="723" height="34" rx="10" fill="#11111b"/>
  <rect y="24" width="723" height="10" fill="#11111b"/>
  <circle cx="25" cy="17" r="5" fill="#ff5f56"/><circle cx="41" cy="17" r="5" fill="#ffbd2e"/><circle cx="57" cy="17" r="5" fill="#27c93f"/>
  <text x="361.5" y="21" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6c7086">savemytokens</text>
  <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5">
  <text x="20" y="66.5" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens</tspan><tspan fill="#cdd6f4">                         </tspan><tspan fill="rgb(147,153,178)">the control centre</tspan><tspan fill="#cdd6f4">                            </tspan></text>
  <text x="20" y="85.25" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens status</tspan><tspan fill="#cdd6f4">                  </tspan><tspan fill="rgb(147,153,178)">one plain-text snapshot · --json for a script</tspan><tspan fill="#cdd6f4"> </tspan></text>
  <text x="20" y="104" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens share buydiff 40</tspan><tspan fill="#cdd6f4">        </tspan><tspan fill="rgb(147,153,178)">pin a project's allocation</tspan><tspan fill="#cdd6f4">                    </tspan></text>
  <text x="20" y="122.75" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens priority buydiff high</tspan><tspan fill="#cdd6f4">   </tspan><tspan fill="rgb(147,153,178)">who gets spare capacity first</tspan><tspan fill="#cdd6f4">                 </tspan></text>
  <text x="20" y="141.5" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens release buydiff</tspan><tspan fill="#cdd6f4">         </tspan><tspan fill="rgb(147,153,178)">hand its unused share back</tspan><tspan fill="#cdd6f4">                    </tspan></text>
  <text x="20" y="160.25" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens policy strict</tspan><tspan fill="#cdd6f4">           </tspan><tspan fill="rgb(147,153,178)">wind down earlier when it gets tight</tspan><tspan fill="#cdd6f4">          </tspan></text>
  <text x="20" y="179" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens hud</tspan><tspan fill="#cdd6f4">                     </tspan><tspan fill="rgb(147,153,178)">pick a status line, previewed on your numbers</tspan><tspan fill="#cdd6f4"> </tspan></text>
  <text x="20" y="197.75" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens theme</tspan><tspan fill="#cdd6f4">                   </tspan><tspan fill="rgb(147,153,178)">eighteen themes, or write your own</tspan><tspan fill="#cdd6f4">            </tspan></text>
  <text x="20" y="216.5" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens defer</tspan><tspan fill="#cdd6f4">                   </tspan><tspan fill="rgb(147,153,178)">work a session pushed to next time</tspan><tspan fill="#cdd6f4">            </tspan></text>
  <text x="20" y="235.25" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens audit</tspan><tspan fill="#cdd6f4">                   </tspan><tspan fill="rgb(147,153,178)">what your last 7 days wasted</tspan><tspan fill="#cdd6f4">                  </tspan></text>
  <text x="20" y="254" xml:space="preserve" textLength="682.5" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens privacy</tspan><tspan fill="#cdd6f4">                 </tspan><tspan fill="rgb(147,153,178)">every file it reads and writes</tspan><tspan fill="#cdd6f4">                </tspan></text>
  <text x="20" y="272.75" xml:space="preserve" textLength="690.0" lengthAdjust="spacing"><tspan fill="#cdd6f4">  </tspan><tspan fill="rgb(137,180,250)">$</tspan><tspan fill="#cdd6f4"> </tspan><tspan fill="rgb(205,214,244)">npx savemytokens uninstall</tspan><tspan fill="#cdd6f4">               </tspan><tspan fill="rgb(147,153,178)">remove every trace · --purge drops the data too</tspan></text>
  </g>
</svg>
